<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
  
  <title>Gerenciador de finanças</title>
</head>

<body>
  <header class="cabecalho">
    <div class="container">
      <h1>💰 Finanças 💰</h1>
    </div>
  </header>

  <main class="conteudo">
    <div class="container">
      <section class="painel">
        <h2>Novo registro</h2>

        <form id="form-registro" class="form">
          <div class="campo">
            <label for="data">Data</label>
            <input id="data" name="data" type="date" required />
          </div>

          <div class="campo">
            <label for="tipo">Tipo</label>
            <select id="tipo" name="tipo" required>
              <option value="receita">Receita</option>
              <option value="despesa">Despesa</option>
            </select>
          </div>

          <div class="campo campo-largo">
            <label for="item">Descrição</label>
            <input id="item" name="item" type="text" placeholder="Ex: Salário, Mercado, Uber" required />
          </div>

          <div class="campo">
            <label for="valor">Valor</label>
            <input id="valor" name="valor" type="number" step="0.01" min="0.01" placeholder="Ex: 10.50" required />
          </div>

          <div class="acoes">
            <button class="btn btn-primario" type="submit">Adicionar</button>
            <button class="btn" id="btn-limpar" type="button">Limpar</button>
          </div>
        </form>
      </section>

      <section class="resumo" aria-label="Resumo financeiro">
        <div class="card-resumo">
          <span class="rotulo">Receitas</span>
          <strong id="total-receitas">R$ 0,00</strong>
        </div>
        <div class="card-resumo">
          <span class="rotulo">Despesas</span>
          <strong id="total-despesas">R$ 0,00</strong>
        </div>
        <div class="card-resumo destaque">
          <span class="rotulo">Saldo</span>
          <strong id="saldo">R$ 0,00</strong>
        </div>
      </section>

      <section class="registros">
        <div class="registros-topo">
          <h2>Registros</h2>

          <div class="filtros">
            <select id="filtro-tipo" class="input" aria-label="Filtrar por tipo">
              <option value="todos">Todos</option>
              <option value="receita">Receitas</option>
              <option value="despesa">Despesas</option>
            </select>

            <input id="busca" class="input" type="search" placeholder="Buscar por descrição" aria-label="Buscar por descrição" />

            <button class="btn btn-perigo" id="btn-apagar-tudo" type="button">Apagar tudo</button>
          </div>
        </div>

        <div id="lista-registros" class="lista" role="list"></div>

        <p id="estado-vazio" class="vazio" hidden>
          Nenhum registro ainda. Adicione sua primeira receita ou despesa.
        </p>
      </section>
    </div>
  </main>

  <div id="modal" class="modal" aria-hidden="true">
    <div class="modal-conteudo" role="dialog" aria-modal="true" aria-labelledby="titulo-modal">
      <h3 id="titulo-modal">Editar registro</h3>

      <form id="form-editar" class="form">
        <input type="hidden" id="editar-id" />

        <div class="campo">
          <label for="editar-data">Data</label>
          <input id="editar-data" type="date" required />
        </div>

        <div class="campo">
          <label for="editar-tipo">Tipo</label>
          <select id="editar-tipo" required>
            <option value="receita">Receita</option>
            <option value="despesa">Despesa</option>
          </select>
        </div>

        <div class="campo campo-largo">
          <label for="editar-item">Descrição</label>
          <input id="editar-item" type="text" required />
        </div>

        <div class="campo">
          <label for="editar-valor">Valor</label>
          <input id="editar-valor" type="number" step="0.01" min="0.01" required />
        </div>

        <div class="acoes">
          <button class="btn btn-primario" type="submit">Salvar</button>
          <button class="btn" id="btn-cancelar-modal" type="button">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <footer class="rodape">
    <div class="container">
      <p>Finanças. Todos os direitos reservados.</p>
    </div>
  </footer>
</body>
</html>
